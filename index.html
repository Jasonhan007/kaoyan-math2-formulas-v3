<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <title>考研数学二公式大全</title>
  <meta name="description" content="考研数学二公式大全：高等数学 + 线性代数，含公式、成立条件与易错提醒，支持搜索与收藏。">
  <meta name="format-detection" content="telephone=no">

  <!-- iOS 主屏幕 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="数学二公式">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef2f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070a12">

  <link rel="icon" type="image/png" href="assets/icon-180.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180"
        href="https://jasonhan007.github.io/kaoyan-math2-formulas-v3/assets/icon-180.png?v=3">
  <link rel="stylesheet" href="vendor/katex.min.css">
  <script defer src="vendor/katex.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <div class="topbar-row title-row">
      <div class="brand">
        <img class="brand-icon" src="assets/icon-180.png" alt="" width="34" height="34">
        <div class="brand-text">
          <h1>考研数学二公式大全</h1>
          <p id="brandSub">高等数学 · 线性代数</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" aria-label="切换深浅色">
          <svg class="ic-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
          <svg class="ic-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.4 8.4 0 1 1 9.8 3.5a6.9 6.9 0 0 0 10.7 10.7z"/></svg>
        </button>
        <button class="icon-btn" id="favBtn" aria-label="只看收藏" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 20.3s-7.4-4.6-9.2-9A5.1 5.1 0 0 1 12 6.4a5.1 5.1 0 0 1 9.2 4.9c-1.8 4.4-9.2 9-9.2 9z"/></svg>
        </button>
      </div>
    </div>

    <div class="topbar-row search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.4"/><path d="M15.8 15.8 20.5 20.5"/></svg>
        <input id="searchInput" type="search" placeholder="搜索公式：洛必达、特征值、极坐标…" autocomplete="off" spellcheck="false">
        <button class="clear-btn" id="clearBtn" aria-label="清空" hidden>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <span class="result-chip" id="resultChip" hidden></span>
    </div>

    <nav class="topbar-row chips-row" id="chipsRow" aria-label="章节导航"></nav>
  </header>

  <div class="layout">
    <aside class="toc" id="toc" aria-label="目录"></aside>

    <main class="content" id="content">
      <section class="hero">
        <img class="hero-icon" src="assets/icon.png" alt="应用图标" width="96" height="96">
        <div class="hero-text">
          <p class="hero-kicker" id="heroScope">数学二考试范围</p>
          <h2 id="heroTitle">考研数学二 · 公式大全</h2>
          <p class="hero-desc">系统整理高等数学与线性代数核心公式，每条含<b>名称 · 表达式 · 成立条件 · 易错提醒</b>。优先保证准确完整，支持搜索与收藏。</p>
          <div class="hero-stats">
            <span class="stat"><b id="statFav">0</b> 收藏</span>
            <span class="stat"><b id="statSec">12</b> 章节</span>
            <span class="stat"><b id="statNum">0</b> 公式</span>
          </div>
        </div>
      </section>

      <div id="katexBanner" class="banner" hidden>公式渲染组件加载失败，请检查 vendor/ 目录是否完整。</div>

      <div id="sections"></div>

      <div class="empty" id="emptyState" hidden>
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.4"/><path d="M15.8 15.8 20.5 20.5"/></svg>
        <p id="emptyText">没有找到相关公式</p>
        <button class="ghost-btn" id="resetBtn">清除条件</button>
      </div>

      <footer class="page-foot">
        <p>公式按最新考研数学二考试范围整理 · 核心参考：同济高数/线代 · 教育部考试大纲</p>
        <p class="dim">添加到 iPhone 主屏幕即可全屏使用 · 公式本地渲染，无需联网。</p>
      </footer>
    </main>
  </div>

  <!-- 移动端底部标签栏 -->
  <nav class="tabbar" aria-label="主导航">
    <button class="tab active" data-tab="all">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15M4.5 12h15M4.5 17.5h9"/></svg>
      <span>公式</span>
    </button>
    <button class="tab" data-tab="fav">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 20.3s-7.4-4.6-9.2-9A5.1 5.1 0 0 1 12 6.4a5.1 5.1 0 0 1 9.2 4.9c-1.8 4.4-9.2 9-9.2 9z"/></svg>
      <span>收藏</span>
      <em class="tab-badge" id="favBadge" hidden>0</em>
    </button>
    <button class="tab" data-tab="toc">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="4.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4.5" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>
      <span>目录</span>
    </button>
  </nav>

  <!-- 移动端目录底部弹层 -->
  <div class="sheet-mask" id="sheetMask" hidden></div>
  <div class="sheet" id="sheet" hidden aria-label="章节目录">
    <div class="sheet-grip"></div>
    <div class="sheet-head"><h3>目录</h3><button class="ghost-btn" id="sheetClose">关闭</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
